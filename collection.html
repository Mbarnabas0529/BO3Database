<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BO3 GobbleGum Console Commands</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Hamburger Icon -->
    <div class="hamburger" id="hamburgerMenu">
        <span></span>
        <span></span>
        <span></span>
    </div>

    <!-- Side Menu -->
    <nav class="side-menu" id="sideMenu">
        <ul>
            <li><a href="index.html" id="nav-home">Home</a></li>
            <li><a href="collection.html" id="nav-collection">Collection</a></li>
            <li><a href="randomizer.html" id="nav-randomizer">Randomizer</a></li>
            <li><a href="#" class="wip-link">Mods <span class="wip-icon" title="Work in progress">⚠️</span></a></li>
        </ul>
    </nav>

    <header>
        <h1 id="page-title">Zombies GobbleGum Terminal</h1>
        <p class="subtitle" id="page-subtitle">Console Command Reference Database</p>
        <div class="search-container" id="searchContainer">
            <input type="text" id="searchInput" placeholder="Search...">
            <button id="toggleGeneratorBtn" class="action-btn">Pack Generator</button>
        </div>
    </header>

    <!-- Generator Panel (Hidden by default) -->
    <div id="generatorPanel" class="generator-panel" style="display: none;">
        <h2>Selected GobbleGums (<span id="selectedCount">0</span>/5)</h2>
        <div class="selected-gums-grid" id="selectedGumsGrid"></div>
        <textarea id="generatedCommandOutput" readonly placeholder="Selected commands will appear here..."></textarea>
        <button id="copyGeneratedBtn" class="action-btn">Copy All</button>
    </div>

    <!-- Modal Popup (Hidden by default) -->
    <div id="gumModal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <span class="close-modal" id="closeModal">&times;</span>
            <div class="modal-header">
                <img id="modalImage" src="" alt="GobbleGum">
                <div class="modal-title-wrapper">
                    <h2 id="modalName">Name</h2>
                    <span id="modalType" class="gg-type">Type</span>
                </div>
            </div>
            <div class="modal-body">
                <p id="modalEffect">Effect description...</p>
            </div>
        </div>
    </div>

    <div class="container" id="gum-container">
    </div>

    <script src="script.js"></script>
</body>
</html>
